services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_OPENCLAW_GATEWAY_URL: ws://localhost:18789
        VITE_OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
        VITE_OPENCLAW_AGENT_ID: main
    container_name: executive-console-frontend
    restart: unless-stopped
    depends_on:
      - openclaw
    ports:
      - "5173:80"
    networks:
      - private-app

  openclaw:
    image: openclaw/gateway:latest
    container_name: openclaw
    restart: unless-stopped
    environment:
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
    ports:
      - "18789:18789"
    expose:
      - "18789"
    networks:
      - private-app

networks:
  private-app:
    driver: bridge
